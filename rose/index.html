<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>haki wrda ou aji ntna9cho azin</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; overflow:hidden; }
  body { display:flex; font-family: Georgia, 'Times New Roman', serif; }

  /* ---------- ART PANEL ---------- */
  .art { position:relative; flex:0 0 58%; height:100dvh; background:#000; }
  .art canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .quote {
    position:absolute; top:5.5%; left:0; right:0; text-align:center;
    color:#ffd9e2; font-style:italic; font-size:clamp(17px, 2.6vw, 34px);
    letter-spacing:.4px; padding:0 16px;
    text-shadow:0 0 14px rgba(255,170,195,.55), 0 0 42px rgba(255,150,180,.30);
    opacity:0; transition:opacity 2.4s ease;
    pointer-events:none;
  }
  .quote.show { opacity:1; }

  /* ---------- CODE PANEL ---------- */
  .code {
    flex:1; height:100dvh; background:#0d0d12; color:#d4d4d4;
    font-family:'Cascadia Code', Consolas, 'Courier New', monospace;
    display:flex; flex-direction:column; overflow:hidden;
    border-left:1px solid #1b1b22;
  }
  .codebar {
    flex:0 0 auto; display:flex; align-items:center; gap:7px;
    padding:9px 12px; background:#12121a; border-bottom:1px solid #1b1b22;
  }
  .dot { width:11px; height:11px; border-radius:50%; }
  .dot.r { background:#ff5f57; } .dot.y { background:#febc2e; } .dot.g { background:#28c840; }
  .fname { margin-left:8px; font-size:12px; color:#9a9aad; letter-spacing:.3px; }
  .codebody { flex:1; display:flex; overflow:hidden; padding:12px 0; }
  .gutter {
    flex:0 0 auto; text-align:right; padding:0 10px 0 14px;
    color:#45455a; font-size:11.5px; line-height:1.62; user-select:none; white-space:pre;
  }
  .srclines { font-size:11.5px; line-height:1.62; white-space:pre; overflow:hidden; }
  .k { color:#c586c0; } .b { color:#569cd6; } .s { color:#ce9178; }
  .n { color:#b5cea8; } .c { color:#6a9955; font-style:italic; } .f { color:#dcdcaa; }
  .p { color:#d4d4d4; }

  @media (max-width: 760px) {
    body { flex-direction:column; }
    .art { flex:0 0 60%; width:100%; height:auto; }
    .code { width:100%; height:auto; border-left:none; border-top:1px solid #1b1b22; }
    .quote { top:4%; }
  }
</style>
</head>
<body>

  <!-- ================= ART ================= -->
  <section class="art" id="artPanel">
    <canvas id="cv"></canvas>
    <div class="quote" id="quote">haki wrda ou aji ntna9cho azin</div>
  </section>

  <!-- ================= CODE ================= -->
  <aside class="code">
    <div class="codebar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="fname">rose.py — python</span>
    </div>
    <div class="codebody">
      <div class="gutter" id="gutter"></div>
      <div class="srclines" id="src"></div>
    </div>
  </aside>

<script>
/* ================================================================
   The Python program shown in the right panel (display only)
   ================================================================ */
const CODE = [
'<span class="k">import</span> <span class="p">pygame</span>',
'<span class="k">import</span> <span class="p">sys</span>',
'<span class="k">import</span> <span class="p">cv2</span>',
'<span class="k">import</span> <span class="p">numpy</span> <span class="k">as</span> <span class="p">np</span>',
'<span class="k">import</span> <span class="p">random</span>',
'<span class="k">import</span> <span class="p">math</span>',
'',
'<span class="p">pygame.</span><span class="f">init</span><span class="p">()</span>',
'',
'<span class="p">W, H =</span> <span class="n">1920</span><span class="p">,</span> <span class="n">1080</span>',
'<span class="p">screen = pygame.display.</span><span class="f">set_mode</span><span class="p">((W, H))</span>',
'<span class="p">pygame.display.</span><span class="f">set_caption</span><span class="p">(</span><span class="s">"Rose | Python Art"</span><span class="p">)</span>',
'<span class="p">clock = pygame.time.</span><span class="f">Clock</span><span class="p">()</span>',
'<span class="p">FPS =</span> <span class="n">60</span>',
'',
'<span class="p">random.</span><span class="f">seed</span><span class="p">(</span><span class="n">42</span><span class="p">)</span>',
'',
'<span class="p">COLORS = [</span>',
'    <span class="p">(</span><span class="n">255</span><span class="p">,</span> <span class="n">201</span><span class="p">,</span> <span class="n">201</span><span class="p">),</span>',
'    <span class="p">(</span><span class="n">255</span><span class="p">,</span> <span class="n">225</span><span class="p">,</span> <span class="n">225</span><span class="p">),</span>',
'    <span class="p">(</span><span class="n">255</span><span class="p">,</span> <span class="n">255</span><span class="p">,</span> <span class="n">255</span><span class="p">),</span>',
'    <span class="p">(</span><span class="n">244</span><span class="p">,</span> <span class="n">178</span><span class="p">,</span> <span class="n">197</span><span class="p">),</span>',
'<span class="p">]</span>',
'',
'<span class="p">QUOTE =</span> <span class="s">"haki wrda ou aji ntna9cho azin"</span>',
'',
'<span class="c"># load the picture and find its edges</span>',
'<span class="p">img = cv2.</span><span class="f">imread</span><span class="p">(</span><span class="s">\'flower.jpg\'</span><span class="p">)</span>',
'<span class="k">if</span> <span class="p">img</span> <span class="k">is</span> <span class="b">None</span><span class="p">:</span>',
'    <span class="k">raise</span> <span class="f">FileNotFoundError</span><span class="p">(</span><span class="s">"flower.jpg not found"</span><span class="p">)</span>',
'',
'<span class="p">gray = cv2.</span><span class="f">cvtColor</span><span class="p">(img, cv2.COLOR_BGR2GRAY)</span>',
'<span class="p">gray = cv2.</span><span class="f">GaussianBlur</span><span class="p">(gray, (</span><span class="n">5</span><span class="p">,</span> <span class="n">5</span><span class="p">),</span> <span class="n">0</span><span class="p">)</span>',
'<span class="p">edges = cv2.</span><span class="f">Canny</span><span class="p">(gray,</span> <span class="n">50</span><span class="p">,</span> <span class="n">150</span><span class="p">)</span>',
'',
'<span class="p">ys, xs = np.</span><span class="f">where</span><span class="p">(edges &gt;</span> <span class="n">0</span><span class="p">)</span>',
'<span class="p">points =</span> <span class="f">list</span><span class="p">(</span><span class="f">zip</span><span class="p">(xs, ys))</span>',
'<span class="p">random.</span><span class="f">shuffle</span><span class="p">(points)</span>',
'<span class="p">points = points[::</span><span class="n">3</span><span class="p">]</span>',
'',
'<span class="p">font = pygame.font.</span><span class="f">SysFont</span><span class="p">(</span><span class="s">\'Georgia\'</span><span class="p">,</span> <span class="n">38</span><span class="p">, italic=</span><span class="b">True</span><span class="p">)</span>',
'',
'<span class="k">class</span> <span class="f">Dot</span><span class="p">:</span>',
'    <span class="k">def</span> <span class="f">__init__</span><span class="p">(self, tx, ty):</span>',
'        <span class="p">self.x = random.</span><span class="f">randint</span><span class="p">(</span><span class="n">0</span><span class="p">, W)</span>',
'        <span class="p">self.y = random.</span><span class="f">randint</span><span class="p">(</span><span class="n">0</span><span class="p">, H)</span>',
'        <span class="p">self.tx, self.ty = tx, ty</span>',
'        <span class="p">self.color = random.</span><span class="f">choice</span><span class="p">(COLORS)</span>',
'        <span class="p">self.r = random.</span><span class="f">uniform</span><span class="p">(</span><span class="n">1.0</span><span class="p">,</span> <span class="n">2.2</span><span class="p">)</span>',
'        <span class="p">self.t =</span> <span class="n">0.0</span>',
'        <span class="p">self.speed = random.</span><span class="f">uniform</span><span class="p">(</span><span class="n">0.004</span><span class="p">,</span> <span class="n">0.009</span><span class="p">)</span>',
'',
'    <span class="k">def</span> <span class="f">move</span><span class="p">(self):</span>',
'        <span class="p">self.t =</span> <span class="f">min</span><span class="p">(</span><span class="n">1.0</span><span class="p">, self.t + self.speed)</span>',
'        <span class="p">e =</span> <span class="n">1</span> <span class="p">- (</span><span class="n">1</span> <span class="p">- self.t) **</span> <span class="n">3</span>',
'        <span class="p">self.cx = self.x + (self.tx - self.x) * e</span>',
'        <span class="p">self.cy = self.y + (self.ty - self.y) * e</span>',
'',
'<span class="p">dots = [</span><span class="f">Dot</span><span class="p">(x, y)</span> <span class="k">for</span> <span class="p">x, y</span> <span class="k">in</span> <span class="p">points]</span>',
'',
'<span class="p">running =</span> <span class="b">True</span>',
'<span class="k">while</span> <span class="p">running:</span>',
'    <span class="k">for</span> <span class="p">event</span> <span class="k">in</span> <span class="p">pygame.event.</span><span class="f">get</span><span class="p">():</span>',
'        <span class="k">if</span> <span class="p">event.type == pygame.QUIT:</span>',
'            <span class="p">running =</span> <span class="b">False</span>',
'    <span class="p">screen.</span><span class="f">fill</span><span class="p">((</span><span class="n">0</span><span class="p">,</span> <span class="n">0</span><span class="p">,</span> <span class="n">0</span><span class="p">))</span>',
'    <span class="k">for</span> <span class="p">d</span> <span class="k">in</span> <span class="p">dots:</span>',
'        <span class="p">d.</span><span class="f">move</span><span class="p">()</span>',
'        <span class="p">d.</span><span class="f">draw</span><span class="p">(screen)</span>',
'    <span class="p">pygame.display.</span><span class="f">flip</span><span class="p">()</span>',
'    <span class="p">clock.</span><span class="f">tick</span><span class="p">(FPS)</span>',
'',
'<span class="p">pygame.</span><span class="f">quit</span><span class="p">()</span>',
'<span class="p">sys.</span><span class="f">exit</span><span class="p">()</span>'
];
document.getElementById('src').innerHTML = CODE.join('\n');
document.getElementById('gutter').textContent =
  CODE.map((_, i) => i + 1).join('\n');

/* ================================================================
   The art: dots scatter like stars, then fly in and assemble
   the portrait — the same idea as the program on the right.
   ================================================================ */
const panel = document.getElementById('artPanel');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const PALETTE = ['255,201,201', '255,225,225', '255,255,255', '244,178,197'];

let W = 0, H = 0, particles = [], stars = [], startTime = null;
const QUOTE_AT = 4600; // ms — quote fades in once the portrait is formed

function buildParticles() {
  const img = new Image();
  img.onload = () => {
    // offscreen sampling canvas
    const SW = 940, SH = Math.round(SW * img.height / img.width);
    const off = document.createElement('canvas');
    off.width = SW; off.height = SH;
    const octx = off.getContext('2d');
    octx.drawImage(img, 0, 0, SW, SH);
    const data = octx.getImageData(0, 0, SW, SH).data;

    // "contain" fit of the picture inside the art panel
    const scale = Math.min(W / img.width, H / img.height);
    const dw = img.width * scale, dh = img.height * scale;
    const ox = (W - dw) / 2, oy = (H - dh) / 2;

    const targets = [];
    const step = 2;
    for (let y = 0; y < SH; y += step) {
      for (let x = 0; x < SW; x += step) {
        const i = (y * SW + x) * 4;
        const bright = (data[i] + data[i + 1] + data[i + 2]) / 3;
        if (bright > 55) {
          targets.push([ox + (x / SW) * dw, oy + (y / SH) * dh]);
        }
      }
    }
    // thin out to a graceful dot count
    const MAX = 5200;
    if (targets.length > MAX) {
      const k = targets.length / MAX;
      const thinned = [];
      for (let i = 0; i < targets.length; i += k) thinned.push(targets[Math.floor(i)]);
      targets.length = 0; targets.push(...thinned);
    }

    particles = targets.map(([tx, ty]) => ({
      x: Math.random() * W, y: Math.random() * H,
      tx, ty,
      r: 1.0 + Math.random() * 1.4,
      color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
      delay: 700 + Math.random() * 900,
      dur: 2400 + Math.random() * 1600,
      phase: Math.random() * Math.PI * 2,
      tw: 0.6 + Math.random() * 1.4
    }));

    // a few stars that stay scattered
    stars = Array.from({ length: 110 }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: 0.5 + Math.random() * 1.0,
      color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
      phase: Math.random() * Math.PI * 2,
      tw: 0.5 + Math.random() * 1.2
    }));

    startTime = performance.now();
    requestAnimationFrame(frame);
  };
  img.src = 'portrait.webp';
}

function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

function frame(now) {
  const t = now - startTime;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    const a = 0.16 + 0.13 * Math.sin(now * 0.001 * s.tw + s.phase);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${s.color},${a})`;
    ctx.fill();
  }

  for (const p of particles) {
    let px = p.x, py = p.y, a = 0.9;
    const lt = (t - p.delay) / p.dur;
    if (lt < 0) {
      a = 0.35 + 0.2 * Math.sin(now * 0.002 * p.tw + p.phase);
    } else if (lt < 1) {
      const e = easeOutCubic(lt);
      px = p.x + (p.tx - p.x) * e;
      py = p.y + (p.ty - p.y) * e;
      a = 0.95;
    } else {
      px = p.tx; py = p.ty;
      a = 0.68 + 0.32 * Math.sin(now * 0.0011 * p.tw + p.phase);
    }
    ctx.beginPath();
    ctx.arc(px, py, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.color},${a})`;
    ctx.fill();
  }

  if (t > QUOTE_AT) document.getElementById('quote').classList.add('show');
  requestAnimationFrame(frame);
}

function resize() {
  const r = panel.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.round(r.width); H = Math.round(r.height);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!startTime) buildParticles();
}
window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
