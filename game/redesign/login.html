<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLAYM3ANA — Login</title>
<link rel="stylesheet" href="style.css">
<style>
  .wrap{flex:1;display:flex;flex-direction:column;padding:10px 22px calc(18px + var(--sab));position:relative;z-index:2}
  .back{align-self:flex-start;width:42px;height:42px;border-radius:14px;border:1px solid var(--card-line);background:var(--card);
    display:grid;place-items:center;color:#fff;text-decoration:none;font-size:19px}
  .head{text-align:center;margin:16px 0 6px}
  .head .logo{font-size:40px}
  .head h1{font-family:"Baloo 2",cursive;font-size:27px;margin-top:12px}
  .head p{font-size:13.5px;font-weight:700;color:#E4D9FF}
  .gbtn{margin-top:20px;width:100%;display:flex;align-items:center;justify-content:center;gap:11px;background:#fff;color:#2b2b2b;
    border:none;border-radius:999px;padding:15px;font-family:"Baloo 2",cursive;font-weight:700;font-size:17px;cursor:pointer;
    box-shadow:0 12px 26px -10px rgba(0,0,0,.5)}
  .gbtn .g{font-family:"Nunito",sans-serif;font-weight:900;font-size:19px;background:linear-gradient(90deg,#4285F4 25%,#EA4335 25% 50%,#FBBC05 50% 75%,#34A853 75%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .gnote{text-align:center;font-size:11.5px;font-weight:800;color:#CDBCF5;margin-top:7px}
  .or{display:flex;align-items:center;gap:12px;margin:20px 0 16px;color:#CDBCF5;font-size:12px;font-weight:900;letter-spacing:1.5px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:#ffffff2e}
  label{display:block;font-size:12px;font-weight:900;letter-spacing:1.2px;color:#E4D9FF;margin:14px 0 7px}
  .field{display:flex;align-items:center;background:#170A3866;border:1.5px solid var(--card-line);border-radius:16px;padding:0 6px 0 15px}
  .field:focus-within{border-color:var(--violet);box-shadow:0 0 0 3px #8B5CF633}
  .field input{flex:1;background:none;border:none;outline:none;color:#fff;font-family:"Nunito",sans-serif;font-weight:700;font-size:16px;padding:15px 0;min-width:0}
  .field input::placeholder{color:#A793D8}
  .eye{border:none;background:#ffffff14;color:#EDE7FF;width:40px;height:40px;border-radius:12px;font-size:17px;cursor:pointer;flex:0 0 40px}
  .msg{display:none;border-radius:14px;padding:12px 14px;font-size:13.5px;font-weight:800;margin-top:16px;line-height:1.45}
  .msg.err{display:block;background:#F43F5E26;border:1.5px solid #F43F5E88;color:#FFD9DE}
  .msg.ok{display:block;background:#10B98126;border:1.5px solid #10B98188;color:#CFFBEF}
  .msg.info{display:block;background:#38BDF826;border:1.5px solid #38BDF888;color:#D9F2FF}
  .playnote{display:none;margin-top:14px;text-align:center;background:#FFC53D22;border:1.5px dashed #FFC53D99;color:#FFE9A8;
    border-radius:12px;padding:9px;font-size:12.5px;font-weight:900}
  .playnote.show{display:block}
  .submit{width:100%;margin-top:22px}
  .alt{text-align:center;margin-top:auto;padding-top:22px;font-size:14px;font-weight:800;color:#E4D9FF}
  .alt a{color:#FFD97A;text-decoration:none;font-weight:900}
</style>
</head>
<body>
  <div class="phone">
    <div class="confetti"></div>
    <div class="wrap">
      <a class="back" href="index.html" aria-label="Back">←</a>

      <div class="head">
        <div class="logo">PLAYM3ANA</div>
        <h1>Welcome back 👋</h1>
        <p>Log in to your lobby, coins &amp; missions</p>
      </div>

      <div class="playnote" id="playNote">🎮 After login you'll go straight back to your game</div>

      <!-- Real function: Google sign-in, Gmail only. No other social login exists. -->
      <button class="gbtn" id="googleBtn" type="button"><span class="g">G</span> Continue with Google</button>
      <div class="gnote">Gmail only (@gmail.com)</div>

      <div class="or">OR</div>

      <!-- Real function: username OR email/Gmail + password (case-insensitive) -->
      <form id="loginForm" novalidate>
        <label for="ident">USERNAME OR GMAIL</label>
        <div class="field">
          <input id="ident" type="text" placeholder="e.g. omar_7 or you@gmail.com" autocomplete="username" autocapitalize="none">
        </div>

        <label for="pass">PASSWORD</label>
        <div class="field">
          <input id="pass" type="password" placeholder="Your password" autocomplete="current-password">
          <button class="eye" id="eyeBtn" type="button" aria-label="Show password">👁️</button>
        </div>

        <div class="msg" id="msgBox" role="alert"></div>

        <button class="btn submit" id="submitBtn" type="submit">LOG IN&nbsp;→</button>
      </form>

      <div class="alt">New here? <a href="register.html">Create your account →</a></div>
    </div>
  </div>
<script>
  // Demo of the real login rules (preview only — the live game checks the server):
  // · identifier = username OR email/Gmail, case-insensitive
  // · banned account → blocked, frozen account → blocked
  // · Google sign-in accepts Gmail only
  // · ?play=<game>&method=coins|ad in the URL is kept, so login returns to the game unlock
  var params=new URLSearchParams(location.search);
  if(params.get('play')){document.getElementById('playNote').classList.add('show');}

  var msg=document.getElementById('msgBox');
  function show(type,text){msg.className='msg '+type;msg.textContent=text;}
  function hide(){msg.className='msg';msg.textContent='';}

  document.getElementById('eyeBtn').addEventListener('click',function(){
    var p=document.getElementById('pass');
    var showPw=p.type==='password';
    p.type=showPw?'text':'password';
    this.textContent=showPw?'🙈':'👁️';
  });

  document.getElementById('googleBtn').addEventListener('click',function(){
    show('info','Opening Google… only Gmail accounts (@gmail.com) can sign in.');
    setTimeout(function(){location.href='lobby.html';},1200);
  });

  document.getElementById('loginForm').addEventListener('submit',function(e){
    e.preventDefault(); hide();
    var id=document.getElementById('ident').value.trim().toLowerCase();
    var pw=document.getElementById('pass').value;
    if(!id||!pw){show('err','Please fill in your username/Gmail and your password.');return;}
    if(id==='banned'){show('err','🚫 This account is banned. Please contact support.');return;}
    if(id==='frozen'){show('err','🧊 This account is frozen right now. Please try again later.');return;}
    if(pw==='wrong'){show('err','Wrong username or password. Check and try again.');return;}
    var btn=document.getElementById('submitBtn');
    btn.textContent='WELCOME BACK! 🎉'; btn.disabled=true;
    show('ok','Login OK — taking you to your lobby…');
    setTimeout(function(){location.href='lobby.html';},1000);
  });
</script>
</body>
</html>
