<style>
  /* "Store Posters" splash — same design tokens as lobby-store.html:
     near-black screen, lime accent, Nunito, phone shell. */
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
    --bg:#07070D;--lime:#C6F542;--dim:#9C9CAE}
  html,body{height:100%}
  body{font-family:"Nunito",system-ui,sans-serif;color:#fff;background:#000;display:flex;justify-content:center}
  .phone{position:relative;width:100%;max-width:430px;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:calc(20px + var(--sat)) 30px calc(26px + var(--sab));background:
    radial-gradient(120% 46% at 85% -6%,#7C3AED33 0%,transparent 55%),
    radial-gradient(90% 40% at -10% 30%,#DC262622 0%,transparent 55%),var(--bg)}
  .appicon{width:118px;height:118px;border-radius:30px;overflow:hidden;
    box-shadow:0 0 44px #C6F54238, 0 24px 44px -14px rgba(0,0,0,.75);animation:bob 2.2s ease-in-out infinite}
  .appicon img{width:100%;height:100%;object-fit:cover;display:block}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .logo{font-weight:900;font-size:36px;letter-spacing:2px;margin-top:26px}
  .logo i{font-style:normal;color:var(--lime)}
  .tag{margin-top:6px;font-size:13px;font-weight:800;color:var(--dim);letter-spacing:.4px}
  .track{width:212px;height:8px;border-radius:99px;background:#FFFFFF14;margin-top:40px;overflow:hidden}
  .fill{height:100%;width:0;border-radius:99px;background:var(--lime);box-shadow:0 0 14px #C6F54288;
    animation:load 2.2s cubic-bezier(.3,.7,.4,1) forwards}
  @keyframes load{to{width:100%}}
  .loadtxt{margin-top:14px;font-size:13.5px;font-weight:800;color:#E7E7F0}
  .foot{position:absolute;bottom:calc(20px + var(--sab));left:0;right:0;text-align:center;
    font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.6px}
  .errbox{margin-top:34px;text-align:center;max-width:280px}
  .errring{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;border:2.5px solid #E5484D;
    color:#E5484D;display:grid;place-items:center;font-size:30px;font-weight:900}
  .errbox h2{font-size:19px;font-weight:900}
  .errbox p{margin-top:7px;font-size:13px;font-weight:700;color:var(--dim);line-height:1.55}
  .errbox button{margin-top:16px;background:var(--lime);color:#131803;border:none;border-radius:12px;
    padding:11px 22px;font-family:inherit;font-size:14px;font-weight:900;cursor:pointer}
  .demotoggle{position:absolute;right:14px;bottom:calc(16px + var(--sab));font-size:10.5px;font-weight:800;
    color:#55556a;text-decoration:none;letter-spacing:.3px}
</style>
</head>

<script>
  // Splash → lobby after the bar fills (~2.4s), replacing history so Back doesn't return here
  var goLobby = setTimeout(function(){ location.replace('lobby-store.html'); }, 2400);
  // Init-error state (real game: shown when the lobby fails to initialise) — demo via ?error=1
  if (new URLSearchParams(location.search).get('error') === '1') {
    clearTimeout(goLobby);
    document.querySelector('.track').style.display = 'none';
    document.querySelector('.loadtxt').style.display = 'none';
    document.getElementById('errbox').style.display = 'block';
  }
  document.getElementById('reloadBtn').addEventListener('click', function(){
    location.replace('loading-store.html');
  });
</script>
