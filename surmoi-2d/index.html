<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LBS — Essayage Virtuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href=&family=Instrument+Serif:ital@1"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap&family=Instrument+Serif:ital@1" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#efc89f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LBS">
</head>
<body>

<div class="room"></div>

<div class="ghost" aria-hidden="true"><span><img src="assets/ghost-logo.png" alt="" draggable="false"></span></div>

<nav class="tabs glass" id="tabs">
  <div class="pill" id="tabPill"></div>
  <button class="gbtn act" id="gHomme" type="button">Homme</button>
  <button class="tab active" type="button">Tops</button>
  <button class="gbtn" id="gFemme" type="button">Femme</button>
</nav>

<aside class="rail glass">
  <button class="rbtn act" type="button" aria-label="Tops">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 5.1 16.6 2.7a.6.6 0 0 0-.8.3c-.6 1.2-2.1 2-3.8 2s-3.2-.8-3.8-2a.6.6 0 0 0-.8-.3L2.1 5.1a.6.6 0 0 0-.3.8l1.7 3.9a.6.6 0 0 0 .8.3L7 9.4v10.4c0 .3.3.6.6.6h8.8c.3 0 .6-.3.6-.6V9.4l2.7.7c.3.1.7 0 .8-.3l1.7-3.9a.6.6 0 0 0-.3-.8Z"/></svg>
    <span class="rlabel">Tops</span>
  </button>
  <button class="rbtn" id="cartBtn" type="button" aria-label="Panier">
    <span class="cbadge" id="cartBadge" hidden>0</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h2l2.5 12a1 1 0 0 0 1 .8h9.9a1 1 0 0 0 1-.8L20.5 7H6"/><circle cx="10" cy="20.4" r="1.3" fill="currentColor" stroke="none"/><circle cx="17.5" cy="20.4" r="1.3" fill="currentColor" stroke="none"/></svg>
    <span class="rlabel">Panier</span>
  </button>
  <button class="rbtn" type="button" aria-label="Calendrier">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 2.8V6M16 2.8V6"/></svg>
    <span class="rlabel">Calendrier</span>
  </button>
  <button class="rbtn" type="button" aria-label="Profil">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.4-3.8 4.4-5.5 7.5-5.5s6.1 1.7 7.5 5.5"/></svg>
    <span class="rlabel">Profil</span>
  </button>
  <button class="rbtn" id="langBtn" type="button" aria-label="Langue / Language">
    <span class="langTx" id="langTx">FR</span>
  </button>
</aside>

<main class="stage" id="stage">
  <div class="arc" id="arc"></div>
</main>

<div class="model" aria-hidden="true">
  <div class="fig" id="mCur"></div>
  <div class="fig" id="mNext"></div>
  <div class="grid"></div>
  <div class="scan"></div>
</div>

<button class="fbOne glass" id="fbOne" type="button" aria-label="Voir le dos">
  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
  <span id="fbOneTx">Back</span>
</button>

<button class="arrow glass" id="prevBtn" type="button" aria-label="Précédent">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#222" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="14.5 5 7.5 12 14.5 19"/></svg>
</button>
<button class="arrow glass" id="nextBtn" type="button" aria-label="Suivant">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#222" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9.5 5 16.5 12 9.5 19"/></svg>
</button>

<section class="buy glass">
  <div class="thumb" id="thumb"><div class="thumbG" id="thumbG"></div></div>
  <div class="mid">
    <div class="ln name" id="nameLn"><div class="stack"><span>Basic T-shirt</span></div></div>
    <div class="ln price" id="priceLn"><div class="stack"><span>$45</span></div></div>
    <div class="sizeRow">
      <span class="lbl">Taille</span>
      <div class="chips">
        <button class="chip" type="button">S</button>
        <button class="chip act" type="button">M</button>
        <button class="chip" type="button">L</button>
        <button class="chip" type="button">XL</button>
      </div>
    </div>
  </div>
  <div class="acts">
    <a class="buyBtn" id="buyBtn" href="https://yovishop.youcan.store/collections/best-product" target="_blank" rel="noopener">Acheter</a>
    <button class="infoBtn" id="infoBtn" type="button">Plus d'infos</button>
  </div>
</section>

<div class="sheet" id="sheet" hidden>
  <div class="sheetCard">
    <button class="sheetX" id="sheetX" type="button" aria-label="Fermer">✕</button>
    <div class="sheetName" id="sheetName"></div>
    <div class="sheetPrice" id="sheetPrice"></div>
    <p class="sheetDesc" id="sheetDesc"></p>
    <a class="buyBtn sheetBuyBtn" id="sheetBuy" href="#" target="_blank" rel="noopener">Acheter</a>
  </div>
</div>

<div class="cur" id="cur" aria-hidden="true">
  <div class="ring"></div>
  <div class="cdot"></div>
  <div class="clab try">ESSAYER</div>
  <div class="clab drag">GLISSER</div>
</div>


<!-- ================= CART PAGE — the clothing rail ================= -->
<div class="cartPage" id="cartPage" hidden>
  <div class="cpHead">
    <button class="cpBack" id="cpBack" type="button">&#8592; <span id="cpBackTx">Retour</span></button>
    <div class="cpTitle" id="cpTitle">Votre panier</div>
    <div class="cpCount" id="cpCount"></div>
  </div>
  <div class="cpRailView" id="cpRailView">
    <div class="cpRailZone">
      <div class="cpRail"></div>
      <div class="cpRack" id="cpRack"></div>
      <div class="cpCap" id="cpCap"><b id="cpCapName"></b><span id="cpCapSub"></span></div>
    </div>
    <div class="cpEmpty" id="cpEmpty" hidden>
      <p class="cpEmptyT" id="cpEmptyT"></p>
      <p class="cpEmptyH" id="cpEmptyH"></p>
      <button class="cpDiscover" id="cpDiscover" type="button"></button>
    </div>
    <div class="cpBar" id="cpBar">
      <div class="cpTotals"><span id="cpTotalLbl">Total</span><b id="cpTotal">0 MAD</b><small id="cpDeliv"></small></div>
      <button class="cpCheckout" id="cpCheckout" type="button">Commander</button>
    </div>
    <div class="cpBand"><div class="cpBandTrack" id="cpBandTrack"></div></div>
  </div>
  <div class="cpDet" id="cpDet" hidden>
    <div class="cpHit" id="cpHit"></div>
    <div class="cpBig" id="cpBig"><span class="cpHang"></span></div>
    <button class="cpArr" id="cpPrev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 5 L8 12 L15 19"/></svg></button>
    <button class="cpArr" id="cpNext" type="button" aria-label="Next"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5 L16 12 L9 19"/></svg></button>
    <button class="cpFlip glass" id="cpFlip" type="button" aria-label="Voir le dos"><span id="cpFlipTx">Dos</span></button>
    <div class="cpInfo">
      <div class="cpNum" id="cpNum"></div>
      <div class="cpName" id="cpName"></div>
      <div class="cpPrice" id="cpPrice"></div>
      <div class="cpSizeLine" id="cpSizeLine"></div>
      <div class="cpQtyRow">
        <button class="cpQBtn" id="cpQMinus" type="button">&#8722;</button>
        <span id="cpQVal">1</span>
        <button class="cpQBtn" id="cpQPlus" type="button">+</button>
        <button class="cpRemove" id="cpRemove" type="button"></button>
      </div>
    </div>
    <button class="cpClose" id="cpClose" type="button"></button>
  </div>
  <div class="cpForm" id="cpForm" hidden>
    <h3 id="cpFormTitle"></h3>
    <div class="cpSummary" id="cpSummary"></div>
    <label class="cpField"><span id="cpLblName"></span><input id="cpInName" type="text" autocomplete="name"></label>
    <label class="cpField"><span id="cpLblPhone"></span><input id="cpInPhone" type="tel" autocomplete="tel"></label>
    <label class="cpField"><span id="cpLblCity"></span><input id="cpInCity" type="text"></label>
    <label class="cpField"><span id="cpLblAddr"></span><input id="cpInAddr" type="text"></label>
    <button class="cpConfirm" id="cpConfirm" type="button"></button>
    <button class="cpFormBack" id="cpFormBack" type="button"></button>
  </div>
</div>
<script src="js/lang.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
